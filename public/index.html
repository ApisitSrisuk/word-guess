<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e8590c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>ทายคำกับเพื่อน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="offline" class="offline" hidden role="status">📡 สัญญาณหลุด กำลังต่อใหม่… (คำและคะแนนยังอยู่)</div>
  <main>
    <!-- หน้าเข้าสู่ระบบ -->
    <section id="login" class="card">
      <h1>🎯 ทายคำกับเพื่อน</h1>
      <p class="muted">ทุกคนได้คำลับไม่ซ้ำกัน — เก็บคำตัวเองไว้ แล้วทายคำของเพื่อนให้ได้!</p>
      <form id="loginForm">
        <label>ชื่อของคุณ<input id="nameInput" maxlength="20" autocomplete="off" required /></label>
        <label>รหัสห้อง<input id="codeInput" maxlength="10" autocomplete="off" autocapitalize="characters" placeholder="เช่น PARTY1" required /></label>
        <button type="submit">เข้าห้อง</button>
        <p id="loginError" class="error"></p>
      </form>
    </section>

    <!-- ห้องเกม -->
    <section id="room" hidden>
      <header class="topbar">
        <div>ห้อง <b id="roomCode"></b> <span id="roundInfo" class="muted"></span></div>
        <div class="top-actions">
          <button id="chatBtn" class="small" type="button">💬 แชท<span id="chatBadge" class="badge" hidden></span></button>
          <button id="shareBtn" class="secondary small" type="button" aria-label="ชวนเพื่อน">📤</button>
        </div>
      </header>

      <div id="banner" class="banner"></div>
      <ol id="turnStrip" class="turn-strip" hidden aria-label="ลำดับตาเล่น"></ol>

      <div class="layout">
        <div class="col">
          <div id="myCard"></div>
          <div id="players" class="players"></div>

          <div id="hostControls" class="card" hidden>
            <label>หมวด
              <select id="categorySelect"></select>
            </label>
            <button id="startBtn">เริ่มรอบใหม่</button>
            <button id="endBtn" class="secondary" hidden>จบรอบ/เฉลยทั้งหมด</button>
            <p id="hostError" class="error"></p>
          </div>
          <p id="waitHost" class="muted center" hidden>รอหัวห้องกดเริ่มเกม…</p>

        </div>

        <aside class="side">
          <div id="lbCard" class="card lb">
            <h3>🏆 อันดับคะแนน</h3>
            <ol id="leaderboard"></ol>
          </div>
          <div class="card feed">
            <h3>ความเคลื่อนไหว</h3>
            <ul id="feed"></ul>
          </div>
        </aside>
      </div>

      <!-- แถบทายคำ: ติดล่างจอบนมือถือ -->
      <form id="guessForm" class="guessbar" hidden>
        <div id="waitTurn" class="wait-turn" hidden>
          <span id="waitTurnText"></span>
          <button id="skipBtn" type="button" class="secondary small" hidden>⏭️ ข้ามตา</button>
        </div>
        <div id="myTurn">
          <div class="target-line">
            <span>🫵 ตาคุณ! ทายคำของ</span>
            <select id="targetSelect" aria-label="เลือกคนที่จะทาย"></select>
          </div>
          <div class="guess-row">
            <input id="guessInput" maxlength="40" autocomplete="off" autocorrect="off" enterkeyhint="send" placeholder="พิมพ์คำที่ทาย…" aria-label="คำที่ทาย" />
            <button type="submit">ทาย!</button>
            <button id="passBtn" type="button" class="secondary" title="ผ่านตานี้">ผ่าน</button>
          </div>
        </div>
      </form>
    </section>
  </main>

  <!-- แชท: เต็มจอบนมือถือ / ลิ้นชักด้านขวาบนคอม -->
  <div id="chatSheet" class="sheet" hidden role="dialog" aria-label="แชท">
    <div class="sheet-head">
      <b>💬 แชทในห้อง</b>
      <button id="chatClose" class="secondary small" type="button">ปิด ✕</button>
    </div>
    <ul id="chatList" class="chat-list"></ul>
    <div class="quick">
      <button type="button" class="chip" data-q="✅ ใช่">✅ ใช่</button>
      <button type="button" class="chip" data-q="❌ ไม่ใช่">❌ ไม่ใช่</button>
      <button type="button" class="chip" data-q="🤏 ใกล้แล้ว!">🤏 ใกล้แล้ว!</button>
      <button type="button" class="chip" data-q="🤔 ไม่แน่ใจ">🤔 ไม่แน่ใจ</button>
      <button type="button" class="chip" data-q="😂">😂</button>
    </div>
    <form id="chatForm" class="chat-form">
      <input id="chatInput" maxlength="200" autocomplete="off" enterkeyhint="send" placeholder="พิมพ์ข้อความ… ถามใบ้ได้เลย" aria-label="ข้อความ" />
      <button type="submit">ส่ง</button>
    </form>
  </div>
  <div id="toast" class="toast" hidden></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
